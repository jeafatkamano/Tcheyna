# render.yaml — Déploiement Tcheyna (API Flask, frontend statique)
#
# Ce fichier décrit la configuration réellement en production. Il permet de
# recréer les services à l'identique via un Blueprint Render, notamment
# la règle de réécriture du frontend, qui ne peut pas être définie autrement
# que par ce fichier ou par le tableau de bord.
#
# Documentation : https://render.com/docs/blueprint-spec

services:
  # ─── API Flask ───────────────────────────────────────────
  - type: web
    name: tcheyna-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main

    # Lot 3.9 : l'API ne se redéploie que si son propre dossier change. Un
    # merge qui ne touche que frontend/ ou docs/ ne la redémarre plus (ce qui
    # évite aussi un réveil à froid de l'offre gratuite).
    buildFilter:
      paths:
        - backend/**

    # Le code de l'API vit dans backend/ ; les commandes s'y déplacent plutôt
    # que d'utiliser rootDirectory, afin de rester alignées sur les services
    # existants, créés par l'API Render.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn run:app --workers 2 --timeout 60
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Clé du HMAC des codes OTP (lot 1.4). Absente, elle est dérivée de
      # SECRET_KEY ; la changer n'invalide que les codes des 10 dernières
      # minutes.
      - key: OTP_HMAC_KEY
        generateValue: true

      # Limitation de débit (lot 1.4). Nombre de proxys devant l'API qui
      # ajoutent une entrée à X-Forwarded-For : 1 (répartiteur Render) est
      # une hypothèse, À CONFIRMER avant de se fier aux limites par IP —
      # comparer `reseau.remote_addr` de GET /api/admin/diagnostic à sa
      # propre IP publique. Trop petit : tous les clients partagent une IP ;
      # trop grand : la limite de connexion se contourne.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Compteurs en mémoire, propres à chaque worker (plafond réel jusqu'à
      # 2× le quota) ; `redis://…` les partagerait.
      - key: RATELIMIT_STORAGE_URI
        value: memory://

      # Chaîne de connexion PostgreSQL (Supabase) — à renseigner dans le
      # tableau de bord. Sans elle, l'API refuse de démarrer : le repli SQLite
      # perdrait les données à chaque redémarrage.
      - key: DATABASE_URL
        sync: false

      # Doit reproduire exactement l'URL du frontend, sans barre oblique finale.
      # https://localhost : origine de l'application Android (WebView
      # Capacitor). Sans risque ici : l'authentification passe par l'en-tête
      # Authorization, jamais par un cookie (voir frontend/ANDROID.md).
      - key: CORS_ORIGINS
        value: https://tcheyna.onrender.com,https://localhost

      # Stockage des fichiers (Supabase Storage). Sans SUPABASE_SERVICE_KEY,
      # l'API refuse les téléversements en production plutôt que de les
      # écrire sur le disque de l'instance, qui est effacé à chaque
      # redémarrage.
      # Le dépôt est public : l'URL désigne le projet Supabase et n'a pas à y
      # figurer. La valeur est déjà posée dans le tableau de bord Render.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET_PUBLIC
        value: tcheyna-photos
      - key: SUPABASE_BUCKET_PRIVE
        value: tcheyna-documents

      # Tâches nocturnes (lot 1.25) : jeton attendu par
      # POST /api/interne/taches-nocturnes dans l'en-tête X-Taches-Jeton. Le
      # même est saisi dans cron-job.org. Absent : la route répond 404.
      # 32 caractères au moins, sinon l'API refuse de démarrer.
      - key: TACHES_NOCTURNES_JETON
        sync: false

      # Uniquement utilisé en développement local.
      - key: UPLOAD_FOLDER
        value: uploads

      # Africa's Talking — vérification par SMS.
      # Sans clé, le code OTP n'est pas envoyé ; il est renvoyé par l'API en
      # mode développement uniquement.
      - key: AT_API_KEY
        sync: false
      # Nom d'utilisateur du compte Africa's Talking de production, à
      # renseigner dans le tableau de bord (lot 1.17). « sandbox » n'envoie
      # aucun SMS réel. Render ignore `sync: false` sur un Blueprint déjà
      # créé : la valeur en place reste jusqu'à ce qu'on la change à la main.
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        value: TCHEYNA

      # CinetPay — Mobile Money.
      # Sans clé, un paiement reste au statut « en attente » au lieu d'échouer.
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_NOTIFY_URL
        value: https://tcheyna-api.onrender.com/api/payments/callback
      - key: CINETPAY_RETURN_URL
        value: https://tcheyna.onrender.com/paiements

  # ─── Tâches nocturnes (lot 1.25, D13 révisée) ───────────
  # Pas de service `type: cron` : Render exige une carte bancaire pour un
  # Cron Job, même à 1 $ par mois. Chaque nuit à 03:00 (Africa/Conakry),
  # cron-job.org appelle POST /api/interne/taches-nocturnes sur tcheyna-api,
  # avec l'en-tête X-Taches-Jeton (variable TACHES_NOCTURNES_JETON
  # ci-dessus). La route enchaîne reprise des suppressions, purge des pièces
  # (D5), validité des revenus (D12), expiration des annonces (D6) et rappels
  # de visite. Réglage : docs/RUNBOOK_PHASE1.md, « Tâches nocturnes ».

  # ─── Frontend React ──────────────────────────────────────
  - type: web
    name: tcheyna
    runtime: static
    branch: main

    # Lot 3.9 : le frontend ne se reconstruit que si son propre dossier change.
    buildFilter:
      paths:
        - frontend/**

    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist

    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_URL
        value: https://tcheyna-api.onrender.com/api

    # Application monopage : toute route inconnue doit servir index.html.
    # Sans cette règle, recharger /tenant/dashboard ou ouvrir un lien partagé
    # vers une annonce renvoie une erreur 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Service worker et manifest (lot 3.3) : toujours revérifiés, sinon une
      # nouvelle version du site resterait invisible derrière l'ancienne.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache

      # En-têtes de sécurité (lot 1.17), sur toutes les routes, y compris
      # index.html servi par la réécriture et sw.js (la CSP de sw.js régit
      # les requêtes du service worker lui-même).
      #
      # CSP : rien d'inline dans le build Vite ; seules exceptions, la page
      # public/hors-ligne.html, autorisée par empreinte (son bloc <style> et
      # son onclick="location.reload()"). Toute modification de cette page
      # change l'empreinte : `node scripts/verifier-csp.mjs`, lancé par la CI
      # après le build, le signale avec la nouvelle valeur à recopier ici.
      #   • fonts.googleapis.com / fonts.gstatic.com : police Plus Jakarta
      #     Sans (src/styles/fonts.css).
      #   • *.supabase.co : photos du stockage public (le dépôt est public,
      #     le nom du projet n'y figure pas) ; aussi dans connect-src, car le
      #     service worker les relit par fetch() pour le cache hors ligne.
      #   • API : VITE_API_URL ci-dessus (même origine dans les deux).
      #   • blob: : aperçus des photos avant téléversement.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-hashes' 'sha256-9gOBGqEQINNDuds+tkXbNzih6klbz+KeCyxEj4KRLeM=';
          style-src 'self' https://fonts.googleapis.com 'sha256-4fLmxw9BupI3iooEXtTtNH0Cs3dvHVHAPY1IjcoaLJc=';
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' blob: https://*.supabase.co https://tcheyna-api.onrender.com;
          connect-src 'self' https://tcheyna-api.onrender.com https://*.supabase.co;
          manifest-src 'self';
          worker-src 'self';
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Fonctions du navigateur dont le site ne se sert pas. Restent permis :
      # web-share et le presse-papiers (bouton « Partager » d'une annonce).
      # Le choix d'une photo passe par <input type="file">, sans caméra.
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=(), display-capture=(), browsing-topics=()
